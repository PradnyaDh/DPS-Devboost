<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevBoost Explorer — Logistics</title>
<style>
  :root {
    --bg:#0f1117; --surface:#1a1d27; --surface2:#222536; --border:#2d3148;
    --text:#e2e8f0; --muted:#8b96ab; --accent:#6366f1;
    --red:#ef4444; --amber:#f59e0b; --green:#22c55e;
    --b1:#dc2626; --b2:#f97316; --b3:#eab308; --b4:#84cc16; --b5:#16a34a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f8fafc; --surface:#fff; --surface2:#f1f5f9; --border:#e2e8f0;
            --text:#0f172a; --muted:#64748b; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         background:var(--bg); color:var(--text); line-height:1.5; padding:1.5rem 2rem 4rem; }
  .wrap { max-width:1280px; margin:0 auto; }

  header { display:flex; justify-content:space-between; align-items:flex-start;
           gap:1rem; padding-bottom:1rem; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  h1 { font-size:1.35rem; font-weight:700; letter-spacing:-0.02em; }
  .sub { color:var(--muted); font-size:0.85rem; margin-top:0.15rem; }
  .controls { display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; }
  select { background:var(--surface2); color:var(--text); border:1px solid var(--border);
           border-radius:8px; padding:0.4rem 0.6rem; font-size:0.85rem; font-family:inherit; }
  label.ctl { font-size:0.75rem; color:var(--muted); display:flex; gap:0.35rem; align-items:center; }

  nav.crumbs { display:flex; gap:0.35rem; align-items:center; flex-wrap:wrap;
               margin:1.1rem 0 1rem; font-size:0.85rem; }
  .crumb { background:none; border:none; color:var(--accent); cursor:pointer;
           font:inherit; padding:0.15rem 0.3rem; border-radius:5px; }
  .crumb:hover { background:var(--surface2); }
  .crumb.here { color:var(--text); font-weight:650; cursor:default; }
  .crumb.here:hover { background:none; }
  .sep { color:var(--muted); }

  .prov { margin:-0.4rem 0 1rem; font-size:0.8rem; }
  .prov > summary { cursor:pointer; color:var(--muted); font-size:0.75rem;
                    list-style:none; display:inline-flex; align-items:center; gap:0.35rem; }
  .prov > summary::-webkit-details-marker { display:none; }
  .prov > summary::before { content:'▸'; font-size:0.7rem; }
  .prov[open] > summary::before { content:'▾'; }
  .prov > summary:hover { color:var(--text); }
  .prov-body { background:var(--surface); border:1px solid var(--border); border-radius:10px;
               padding:0.9rem 1rem; margin-top:0.6rem; }
  .prov-links { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.85rem; }
  .prov-links a { display:inline-flex; align-items:center; gap:0.3rem; text-decoration:none;
                  background:var(--surface2); border:1px solid var(--border); border-radius:7px;
                  padding:0.28rem 0.6rem; font-size:0.76rem; }
  .prov-links a:hover { border-color:var(--accent); }
  .prov-tbl { width:100%; border-collapse:collapse; font-size:0.76rem; }
  .prov-tbl th { text-align:left; font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em;
                 color:var(--muted); padding:0.3rem 0.5rem 0.3rem 0; border-bottom:1px solid var(--border);
                 cursor:default; }
  .prov-tbl td { padding:0.38rem 0.5rem 0.38rem 0; border-bottom:1px solid var(--border);
                 vertical-align:top; color:var(--muted); }
  .prov-tbl td.mname { color:var(--text); font-weight:600; white-space:nowrap; }
  .prov-tbl td.mrange { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .prov-tbl tr.on td { background:color-mix(in srgb, var(--accent) 9%, transparent); }
  .prov-foot { margin-top:0.7rem; font-size:0.72rem; color:var(--muted); }
  .hero { display:grid; grid-template-columns:260px 1fr; gap:1rem; margin-bottom:1.25rem; }
  @media (max-width:860px){ .hero{ grid-template-columns:1fr; } }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.25rem; }
  .scorebox { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .score-num { font-size:3.5rem; font-weight:800; letter-spacing:-0.04em; line-height:1; }
  .score-cap { font-size:0.7rem; color:var(--muted); text-transform:uppercase;
               letter-spacing:0.09em; margin-top:0.4rem; }
  .score-meta { font-size:0.78rem; color:var(--muted); margin-top:0.7rem; }
  .delta { font-weight:650; }

  h3.cap { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.09em;
           color:var(--muted); margin-bottom:0.9rem; }
  .sparkwrap { position:relative; }
  .spark { width:100%; height:130px; display:block; }
  .spark .hit { fill:transparent; cursor:pointer; }
  .tip { position:absolute; transform:translate(-50%,-100%); pointer-events:none;
         background:var(--surface2); border:1px solid var(--border); border-radius:7px;
         padding:0.3rem 0.5rem; font-size:0.76rem; white-space:nowrap; z-index:2;
         box-shadow:0 2px 8px rgba(0,0,0,0.18); }
  .tip b { font-variant-numeric:tabular-nums; }
  .tip .d { margin-left:0.45rem; font-weight:650; }
  .tip .d::before { content:''; }

  .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:0.75rem; }
  @media (max-width:980px){ .metrics{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:620px){ .metrics{ grid-template-columns:1fr;} }
  .m { background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:0.85rem 0.95rem; }
  .m-top { display:flex; justify-content:space-between; gap:0.5rem; align-items:baseline; }
  .m-name { font-size:0.78rem; color:var(--muted); }
  .m-w { font-size:0.64rem; color:var(--muted); opacity:0.75; }
  .m-val { font-size:1.15rem; font-weight:700; margin:0.35rem 0 0.1rem; letter-spacing:-0.02em; }
  .m-pts { font-size:0.72rem; color:var(--muted); }
  .m-d { font-size:0.75rem; font-weight:650; opacity:0.8; letter-spacing:0; }
  .track { height:5px; background:var(--surface2); border-radius:99px; overflow:hidden; margin-top:0.5rem; }
  .fill { height:100%; border-radius:99px; }

  table { width:100%; border-collapse:collapse; margin-top:0.4rem; font-size:0.84rem; }
  th { text-align:left; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.07em;
       color:var(--muted); font-weight:600; padding:0.5rem 0.55rem; border-bottom:1px solid var(--border);
       white-space:nowrap; cursor:pointer; user-select:none; }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  th:hover { color:var(--text); }
  td { padding:0.55rem; border-bottom:1px solid var(--border); }
  tbody tr:hover { background:var(--surface2); }
  tbody tr.drill { cursor:pointer; }
  .tname { font-weight:600; }
  .tname .lvl { font-size:0.62rem; color:var(--muted); font-weight:500; margin-left:0.4rem;
                text-transform:uppercase; letter-spacing:0.05em; }
  .leaf { color:var(--muted); font-size:0.7rem; }
  .cell { display:flex; align-items:center; gap:0.45rem; justify-content:flex-end; }
  .bar { width:44px; height:5px; background:var(--surface2); border-radius:99px; overflow:hidden; flex-shrink:0; }
  .bar i { display:block; height:100%; border-radius:99px; }
  th.on, td.on { background:color-mix(in srgb, var(--accent) 9%, transparent); }
  th.on { color:var(--text); }
  .m.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .m { cursor:pointer; }
  .m:hover { border-color:var(--accent); }
  .pd { font-size:0.74rem; font-weight:650; opacity:0.85; }

  .childhead { display:flex; align-items:baseline; gap:1rem; margin-top:1.75rem;
               justify-content:space-between; flex-wrap:wrap; }
  .childhead .cap { margin-bottom:0.6rem; }
  .depthctl { display:flex; gap:0.3rem; align-items:center; margin-bottom:0.6rem; }
  .depthctl button { background:var(--surface2); color:var(--muted); border:1px solid var(--border);
                     border-radius:7px; padding:0.25rem 0.55rem; font:inherit; font-size:0.74rem;
                     cursor:pointer; }
  .depthctl button:hover:not(:disabled) { color:var(--text); border-color:var(--accent); }
  .depthctl button:disabled { opacity:0.4; cursor:default; }
  .depthctl .lvl-hint { font-size:0.72rem; color:var(--muted); min-width:5.5rem; }
  .ppath { display:block; font-size:0.68rem; color:var(--muted); font-weight:400;
           margin-top:1px; letter-spacing:0.01em; }
  .note { font-size:0.75rem; color:var(--muted); background:var(--surface);
          border:1px solid var(--border); border-left:3px solid var(--amber);
          border-radius:8px; padding:0.6rem 0.8rem; margin-top:1rem; }
  footer { margin-top:2rem; padding-top:1rem; border-top:1px solid var(--border);
           font-size:0.72rem; color:var(--muted); display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>DevBoost Explorer</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <div class="controls">
      <label class="ctl">Focus <select id="focus"></select></label>
      <label class="ctl">Month <select id="month"></select></label>
      <label class="ctl">Compare <select id="cmp">
        <option value="prev">vs previous month</option>
        <option value="first">vs first month</option>
        <option value="none">no comparison</option>
      </select></label>
    </div>
  </header>

  <nav class="crumbs" id="crumbs"></nav>

  <details class="prov" id="prov">
    <summary>Where these numbers come from</summary>
    <div class="prov-body" id="provBody"></div>
  </details>

  <div class="hero">
    <div class="card scorebox">
      <div class="score-num" id="score">—</div>
      <div class="score-cap">DevBoost score</div>
      <div class="score-meta" id="scoreMeta"></div>
    </div>
    <div class="card">
      <h3 class="cap" id="trendCap">Score trend</h3>
      <div class="sparkwrap">
        <svg class="spark" id="spark"></svg>
        <div class="tip" id="tip" hidden></div>
      </div>
    </div>
  </div>

  <h3 class="cap">Metric breakdown</h3>
  <div class="metrics" id="metrics"></div>

  <div class="childhead">
    <h3 class="cap" id="childCap">Sub-teams</h3>
    <div class="depthctl" id="depthctl"></div>
  </div>
  <div class="card" style="padding:0.35rem 0.6rem"><div style="overflow-x:auto">
    <table id="tbl"><thead></thead><tbody></tbody></table>
  </div></div>

  <div id="notes"></div>

  <footer>
    <div>Source: <code>fulfillment-dwh-production.curated_data_shared_psf.devboost_overall_monthly_score</code></div>
    <div id="gen"></div>
  </footer>
</div>

<script>
const METRICS = [
  {k:'dev_satisf_nps',  label:'Developer satisfaction NPS', w:0.15, good:'hi', fmt:v=>v.toFixed(1), unit:'NPS'},
  {k:'prs_per_eng_day', label:'PRs merged / eng / day',     w:0.15, good:'hi', fmt:v=>v.toFixed(2)},
  {k:'pr_review_hrs',   label:'Code review time (median)',  w:0.15, good:'lo', fmt:v=>v.toFixed(1), unit:'h'},
  {k:'pr_lifetime_hrs', label:'PR lifetime (median)',       w:0.15, good:'lo', fmt:v=>v.toFixed(1), unit:'h'},
  {k:'bugs_per_eng',    label:'Bugs / engineer',            w:0.10, good:'lo', fmt:v=>v.toFixed(2)},
  {k:'depl_per_eng_day',label:'Deployment frequency',       w:0.10, good:'hi', fmt:v=>v.toFixed(2)},
  {k:'focus_nps',       label:'Focus time NPS',             w:0.10, good:'hi', fmt:v=>v.toFixed(1), unit:'NPS'},
  {k:'code_coverage',   label:'Code coverage',              w:0.05, good:'hi', fmt:v=>v.toFixed(1), unit:'%'},
  {k:'code_security',   label:'Code security issues',       w:0.05, good:'lo', fmt:v=>v.toFixed(2)},
];
const OVERALL = {k:'score', label:'Overall DevBoost score', good:'hi', fmt:v=>v.toFixed(1), unit:''};

// What each metric measures, its scoring bounds, and where the number comes from.
const ABOUT = {
  dev_satisf_nps:  {range:'−100 → 100', src:'Developer Experience Survey (quarterly)',
                    note:'NPS over "how satisfied are you with how your team develops and delivers software". Held constant between surveys.'},
  focus_nps:       {range:'−100 → 100', src:'Developer Experience Survey (quarterly)',
                    note:'NPS over the focus-time question. Held constant between surveys.'},
  prs_per_eng_day: {range:'0 → 1',      src:'GitHub PRs merged ÷ working days ÷ engineers',
                    note:'Engineer count is headcount at month end, from Workday P&T via DevHub.'},
  pr_review_hrs:   {range:'15h → 1h',   src:'GitHub PR review time, median',
                    note:'Median rather than mean, so a few stale PRs do not dominate.'},
  pr_lifetime_hrs: {range:'60h → 5h',   src:'GitHub PR lifetime, median',
                    note:'Open to merged. Median for the same reason as review time.'},
  bugs_per_eng:    {range:'5 → 0',      src:'Jira open bugs ÷ engineers',
                    note:'Open bugs at month end, not bugs created during the month.'},
  depl_per_eng_day:{range:'0 → 1',      src:'Deployment events ÷ working days ÷ engineers',
                    note:'Depends on deployment events reaching DataStreams; teams not wired up read as zero.'},
  code_coverage:   {range:'0% → 100%',  src:'Sonar / Codacy covered ÷ coverable lines',
                    note:'Scored against a maximum of 100 upstream though the raw value is a fraction, so it credits ~100× too little.'},
  code_security:   {range:'100 → 0',    src:'Codacy issues, weighted, ÷ engineers',
                    note:'minor×0.3 + medium×0.5 + critical×1, per engineer.'},
};
const DEVHUB = 'https://dev.deliveryhero.net/catalog/default/group/';

// Deep link into the official DevBoost Looker Studio report, filtered to one team.
// Its filter values are "include<U+E000>0<U+E000>IN<U+E000><value>", double-encoded,
// and the team filter (df249) matches hierarchy_full_display_name exactly — which is
// why the snapshot carries that string untouched as `raw`.
const DEVBOOST_REPORT = '7f35fd6c-839d-42f1-b4f5-a6357b16a018';
const DEVBOOST_PAGE = 'EojEF';
const DEVBOOST_SRC = 'm1Y11HWY8Dw';
const SEP = '\ue000';
const dsFilter = v => `include${SEP}0${SEP}IN${SEP}${v}`;
// The report's period filters take a quarter, e.g. "2026'Q1".
function quarterOf(m){
  const [y, mo] = m.split('-').map(Number);
  return `${y}'Q${Math.floor((mo-1)/3)+1}`;
}
function devboostUrl(node, m){
  if (!node.raw) return null;
  // Contributor + bot filters are carried over from the report's own defaults so the
  // numbers match what someone sees when they open it themselves.
  const contributors = dsFilter('Contributor: PRs created by team contributors (humans + HeroGen)');
  const q = dsFilter(quarterOf(m || month));
  const params = {
    df53: contributors, df55: contributors, df145: contributors,
    df105: q, df117: q,
    df207: dsFilter('Human' + SEP + 'HeroGen'),
    df249: dsFilter(node.raw),
  };
  const enc = Object.fromEntries(Object.entries(params).map(([k,v])=>[k, encodeURIComponent(v)]));
  return `https://datastudio.google.com/reporting/${DEVBOOST_REPORT}/page/${DEVBOOST_PAGE}`
       + `?s=${DEVBOOST_SRC}&params=${encodeURIComponent(JSON.stringify(enc))}`;
}
// group_id is "group:<slug>"; DevHub routes on the bare slug
const slug = gid => gid.replace(/^group:/, '');
const metricByKey = k => k==='score' ? OVERALL : METRICS.find(m=>m.k===k);
const hue = t => t>=.75 ? 'var(--green)' : t>=.45 ? 'var(--amber)' : 'var(--red)';
// Five buckets on share-of-points-earned, red -> green. Absolute, not relative to
// siblings: a column where every team is weak should read red across the board.
const BUCKETS = ['var(--b1)','var(--b2)','var(--b3)','var(--b4)','var(--b5)'];
const bucket = t => BUCKETS[Math.min(4, Math.max(0, Math.floor(t*5)))];
// Share of the column's available points for one team-row.
function share(col, s){
  if (s == null) return null;
  if (col.k === 'score') return s.score == null ? null : s.score/100;
  // coverage's official normalized value is ~100x low upstream; colour by the
  // corrected one so the scale reflects real coverage
  if (col.k === 'code_coverage') return s.n_code_coverage_fixed ?? null;
  const n = s['n_'+col.k];
  return n == null ? null : n;
}
const el = id => document.getElementById(id);

let D, cur, month, cmpMode='prev', sortKey='score', sortDir=-1, focus='score', depth=1;

fetch('data/snapshot.json').then(r=>r.json()).then(d=>{
  D = d; cur = d.root;
  const ms = d.complete_months;
  el('month').innerHTML = ms.map(m=>`<option${m===d.latest?' selected':''}>${m}</option>`).join('');
  month = d.latest;
  el('focus').innerHTML = `<option value="score">Overall DevBoost score</option>` +
    METRICS.map(m=>`<option value="${m.k}">${m.label}</option>`).join('');
  el('focus').onchange = e => {
    focus = e.target.value; sortKey = focus; sortDir = -1;
    if (!writeHash()) render();
  };
  el('month').onchange = e => { month = e.target.value; if (!writeHash()) render(); };
  el('cmp').onchange   = e => { cmpMode = e.target.value; if (!writeHash()) render(); };
  el('gen').textContent = `Generated ${d.generated.replace('T',' ').replace('+00:00','Z')}`;
  const n = Object.keys(d.nodes).length;
  el('sub').innerHTML = `${n} teams · ${ms[0]} – ${ms[ms.length-1]}` +
    (d.partial_month ? ` · <span title="excluded: month still in progress">${d.partial_month} partial, excluded</span>` : '');
  addEventListener('hashchange', fromHash);
  fromHash();
});

// View state lives in the hash as query-style params, so a link reproduces
// exactly what the sender was looking at. Only non-defaults are written, so a
// plain drill-down stays short: #team=group:log-deliveries
const DEFAULTS = {focus:'score', depth:1, cmp:'prev'};

function fromHash(){
  const raw = location.hash.slice(1);
  const q = new URLSearchParams(raw);
  // Tolerate the older "#group:id|focus" links.
  if (raw && !raw.includes('=')) {
    const [g, f] = decodeURIComponent(raw).split('|');
    q.set('team', g); if (f) q.set('focus', f);
  }

  const t = q.get('team');
  const next = (t && D.nodes[t]) ? t : D.root;
  if (next !== cur) depth = DEFAULTS.depth;   // depth is relative to the selected node
  cur = next;

  const f = q.get('focus');
  focus = (f === 'score' || METRICS.some(m=>m.k===f)) ? f : DEFAULTS.focus;

  const m = q.get('month');
  month = (m && D.complete_months.includes(m)) ? m : D.latest;

  const c = q.get('cmp');
  cmpMode = ['prev','first','none'].includes(c) ? c : DEFAULTS.cmp;

  const d = parseInt(q.get('depth'), 10);
  depth = Number.isFinite(d) && d >= 1 ? Math.min(d, Math.max(1, maxDepth(cur))) : DEFAULTS.depth;

  // sort=key:dir — falls back to the focused column, which is the default anyway
  const [sk, sd] = (q.get('sort') || '').split(':');
  if (sk && (sk === 'score' || COLS.some(c=>c.k===sk))) {
    sortKey = sk; sortDir = sd === 'asc' ? 1 : -1;
  } else {
    sortKey = focus; sortDir = -1;
  }

  el('focus').value = focus;
  el('month').value = month;
  el('cmp').value = cmpMode;
  render();
  // If anything was out of range or unknown, replace the URL with the state we
  // actually rendered, so copying the link shares the real view.
  const canon = canonicalHash();
  if (location.hash.slice(1) !== canon)
    history.replaceState(null, '', location.pathname + (canon ? '#' + canon : ''));
}

function canonicalHash(){
  const q = new URLSearchParams();
  if (cur !== D.root)            q.set('team', cur);
  if (focus !== DEFAULTS.focus)  q.set('focus', focus);
  if (month !== D.latest)        q.set('month', month);
  if (cmpMode !== DEFAULTS.cmp)  q.set('cmp', cmpMode);
  if (depth !== DEFAULTS.depth)  q.set('depth', String(depth));
  // only record sort when it differs from "the focused column, descending"
  if (!(sortKey === focus && sortDir === -1)) q.set('sort', `${sortKey}:${sortDir===1?'asc':'desc'}`);
  // URLSearchParams percent-encodes ':' in values; harmless but ugly in a shared link
  return q.toString().replace(/%3A/g, ':');
}

function writeHash(){
  const h = canonicalHash();
  const changed = location.hash.slice(1) !== h;
  if (changed) location.hash = h;   // fires hashchange -> fromHash -> render
  return changed;
}
const go = id => { if (id !== cur) depth = 1; cur = id; if (!writeHash()) render(); };

function prevMonth(m){
  const i = D.complete_months.indexOf(m);
  return i > 0 ? D.complete_months[i-1] : null;
}
function baseline(node){
  if (cmpMode === 'none') return null;
  if (cmpMode === 'first') {
    const k = Object.keys(node.series).filter(m=>m<=month).sort();
    return k.length > 1 ? k[0] : null;
  }
  return prevMonth(month);
}

function render(){
  const node = D.nodes[cur], s = node.series[month];
  // breadcrumbs
  const chain = []; for(let p=cur; p; p=D.nodes[p].parent) chain.unshift(p);
  el('crumbs').innerHTML = chain.map((g,i)=>{
    const last = i===chain.length-1;
    return `<button class="crumb${last?' here':''}" data-g="${g}"${last?' disabled':''}>${D.nodes[g].name}</button>` +
           (last?'':'<span class="sep">›</span>');
  }).join('');
  el('crumbs').querySelectorAll('.crumb:not(.here)').forEach(b=>b.onclick=()=>go(b.dataset.g));

  // hero: overall score, or the focused metric's raw value
  const M = metricByKey(focus);
  const b = baseline(node), bs = b && node.series[b];
  el('score').parentElement.querySelector('.score-cap').textContent =
    focus === 'score' ? 'DevBoost score' : M.label;

  if (!s || s[focus] == null) {
    el('score').textContent = '—'; el('score').style.color = 'var(--muted)';
    el('scoreMeta').textContent = `No data for ${month}`;
  } else {
    const v = s[focus];
    el('score').innerHTML = M.fmt(v) + (M.unit ? `<span style="font-size:1.1rem;color:var(--muted)"> ${M.unit}</span>` : '');
    // colour by normalized credit so it reads the same way as the metric cards
    const t = focus === 'score' ? v/100 : (s['n_'+focus] ?? 0);
    el('score').style.color = hue(focus === 'code_coverage' ? (s.n_code_coverage_fixed ?? t) : t);

    let meta = `${node.level.toLowerCase()} · ${month}`;
    if (focus !== 'score') {
      const pts = (s['n_'+focus] ?? 0) * M.w * 100;
      meta += `<br>${pts.toFixed(2)} / ${(M.w*100).toFixed(0)} pts · score ${s.score.toFixed(1)}`;
    }
    if (bs && bs[focus] != null) {
      const d = v - bs[focus];
      const better = M.good === 'hi' ? d > 0 : d < 0;
      const col = d === 0 ? 'var(--muted)' : better ? 'var(--green)' : 'var(--red)';
      meta += `<br><span class="delta" style="color:${col}">${d>=0?'+':''}${M.fmt(d)}${M.unit?' '+M.unit:''}</span> vs ${b}`;
    }
    el('scoreMeta').innerHTML = meta;
  }

  drawProv(node);
  drawSpark(node);
  drawMetrics(s, bs);
  drawChildren(node);
  drawNotes(node, s);
}

// Links out to the authoritative sources, plus what each metric means. Collapsed
// by default: it answers "where does this come from", which is a question people
// ask once per team, not on every glance.
function drawProv(node){
  const sl = slug(node.id);
  const links = [
    ['Repositories & services', DEVHUB + sl + '/owned-applications'],
    ['Members', DEVHUB + sl + '/members'],
    ['DevHub group', DEVHUB + sl],
    [`DevBoost dashboard · ${quarterOf(month)}`, devboostUrl(node, month) || 'https://datastudio.google.com/s/' + DEVBOOST_SRC],
    ['Score methodology', 'https://deliveryhero.atlassian.net/wiki/spaces/techfoundations/pages/231211183/DevBoost+DevBoost+score'],
  ];
  const rows = METRICS.map(m=>{
    const a = ABOUT[m.k] || {};
    return `<tr class="${focus===m.k?'on':''}">
      <td class="mname">${m.label}</td>
      <td class="mrange">${(m.w*100).toFixed(0)}%</td>
      <td class="mrange">${a.range||''}</td>
      <td>${a.src||''}${a.note?`<br><span style="opacity:0.8">${a.note}</span>`:''}</td>
    </tr>`;
  }).join('');
  el('provBody').innerHTML = `
    <div class="prov-links">${links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join('')}</div>
    <table class="prov-tbl">
      <thead><tr><th>Metric</th><th>Weight</th><th>Scored over</th><th>Source</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="prov-foot">
      Engineer headcount (used by every per-engineer metric) comes from Workday P&amp;T via
      DevHub and is not exposed in the score table, so it cannot be shown here — the
      Members link above is the authoritative view.
      Scores are DevBoost's own per-level rows, read directly rather than aggregated.
    </div>`;
}

function drawSpark(node){
  const M = metricByKey(focus);
  const ms = D.complete_months.filter(m=>node.series[m] && node.series[m][focus] != null);
  const svg = el('spark'), tip = el('tip');
  tip.hidden = true;
  el('trendCap').textContent = `${M.label} · ${ms.length} month${ms.length===1?'':'s'}` +
    (M.good === 'lo' ? ' · lower is better' : '');
  if (ms.length < 2) {
    svg.removeAttribute('viewBox');
    svg.innerHTML = `<text x="8" y="20" fill="var(--muted)" font-size="12">Not enough history for ${M.label}</text>`;
    return;
  }
  const W=900, H=130, padX=46, padT=16, padB=30;
  const vals = ms.map(m=>node.series[m][focus]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || Math.abs(hi) || 1;
  lo -= span*0.12; hi += span*0.12;
  if (focus === 'score') { lo = Math.max(0, lo); hi = Math.min(100, hi); }
  const x = i => padX + i*(W-2*padX)/(ms.length-1);
  const y = v => H-padB - (v-lo)/(hi-lo)*(H-padT-padB);
  const pts = vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const ci = ms.indexOf(month);

  // Label about every third month, always including first and last, so 18 months
  // of ticks stay legible at this width. The rest get a short minor tick.
  const step = Math.max(1, Math.ceil(ms.length/7));
  const labelled = new Set([0, ms.length-1]);
  for (let i=0; i<ms.length-1; i+=step) labelled.add(i);
  if ([...labelled].includes(ms.length-2) && ms.length>3) labelled.delete(ms.length-2);

  const ticks = ms.map((m,i)=>{
    const big = labelled.has(i);
    const t = `<line x1="${x(i)}" y1="${H-padB}" x2="${x(i)}" y2="${H-padB+(big?5:3)}" stroke="var(--border)" stroke-width="1"/>`;
    if (!big) return t;
    const anchor = i===0 ? 'start' : i===ms.length-1 ? 'end' : 'middle';
    return t + `<text x="${x(i)}" y="${H-padB+16}" fill="var(--muted)" font-size="10" text-anchor="${anchor}">${m.replace('-','–')}</text>`;
  }).join('');

  const zero = (lo < 0 && hi > 0)
    ? `<line x1="${padX}" y1="${y(0)}" x2="${W-padX}" y2="${y(0)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
       <text x="${padX-6}" y="${y(0)+3}" fill="var(--muted)" font-size="10" text-anchor="end">0</text>` : '';
  const area = `${x(0)},${H-padB} ${pts} ${x(ms.length-1)},${H-padB}`;
  // One hit rect per month, spanning the midpoints either side, so the nearest
  // point is picked without any distance math on mousemove.
  const hits = ms.map((m,i)=>{
    const l = i===0 ? padX-10 : (x(i-1)+x(i))/2;
    const r = i===ms.length-1 ? W-padX+10 : (x(i)+x(i+1))/2;
    return `<rect class="hit" data-i="${i}" x="${l}" y="${padT}" width="${Math.max(1,r-l)}" height="${H-padT-padB}"/>`;
  }).join('');

  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML = `
    <polygon points="${area}" fill="var(--accent)" opacity="0.10"/>
    ${zero}
    <line x1="${padX}" y1="${H-padB}" x2="${W-padX}" y2="${H-padB}" stroke="var(--border)" stroke-width="1"/>
    ${ticks}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${ci>=0?`<line id="selLine" x1="${x(ci)}" y1="${padT}" x2="${x(ci)}" y2="${H-padB}" stroke="var(--border)" stroke-width="1"/>
             <circle cx="${x(ci)}" cy="${y(vals[ci])}" r="4" fill="var(--accent)"/>`:''}
    <line id="hoverLine" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="var(--accent)" stroke-width="1" opacity="0"/>
    <circle id="hoverDot" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
    <text x="4" y="${padT+4}" fill="var(--muted)" font-size="10">${M.fmt(hi)}</text>
    <text x="4" y="${H-padB}" fill="var(--muted)" font-size="10">${M.fmt(lo)}</text>
    ${hits}`;

  const hLine = svg.querySelector('#hoverLine'), hDot = svg.querySelector('#hoverDot');
  const show = i => {
    hLine.setAttribute('x1', x(i)); hLine.setAttribute('x2', x(i));
    hLine.setAttribute('opacity', 0.45);
    hDot.setAttribute('cx', x(i)); hDot.setAttribute('cy', y(vals[i]));
    hDot.setAttribute('opacity', 1);
    // previous month in this series, for the step-over-step change
    let delta = '';
    if (i > 0) {
      const d = vals[i]-vals[i-1];
      const better = M.good === 'hi' ? d > 0 : d < 0;
      const col = d===0 ? 'var(--muted)' : better ? 'var(--green)' : 'var(--red)';
      delta = ` <span class="d" style="color:${col}">${d>=0?'+':''}${M.fmt(d)}</span>`;
    }
    tip.innerHTML = `${ms[i]} · <b>${M.fmt(vals[i])}${M.unit?' '+M.unit:''}</b>${delta}`;
    tip.hidden = false;
    // position in CSS pixels: the viewBox scales to the rendered width
    const box = svg.getBoundingClientRect();
    tip.style.left = (x(i)/W*box.width) + 'px';
    tip.style.top  = Math.max(14, y(vals[i])/H*box.height - 6) + 'px';
  };
  const hide = () => { hLine.setAttribute('opacity',0); hDot.setAttribute('opacity',0); tip.hidden = true; };
  svg.querySelectorAll('.hit').forEach(r=>{
    const i = +r.dataset.i;
    r.onmouseenter = () => show(i);
    r.onmousemove  = () => show(i);
    r.onclick = () => { month = ms[i]; el('month').value = month; if (!writeHash()) render(); };
  });
  svg.onmouseleave = hide;
}

function drawMetrics(s, bs){
  if (!s) { el('metrics').innerHTML = ''; return; }
  el('metrics').innerHTML = METRICS.map(m=>{
    const raw = s[m.k], n = s['n_'+m.k];
    if (raw == null && n == null) return '';
    const t = n == null ? 0 : n;
    const pts = (t*m.w*100), maxPts = m.w*100;
    const cov = m.k === 'code_coverage';
    // Change in raw units vs the comparison month. Muted: it's secondary to the
    // value itself, and nine of these at full contrast would fight the grid.
    let delta = '';
    if (bs && raw != null && bs[m.k] != null) {
      const d = raw - bs[m.k];
      const better = m.good === 'hi' ? d > 0 : d < 0;
      const col = d === 0 ? 'var(--muted)' : better ? 'var(--green)' : 'var(--red)';
      delta = ` <span class="m-d" style="color:${col}">${d>=0?'+':''}${m.fmt(d)}</span>`;
    }
    const shown = cov ? (s.n_code_coverage_fixed ?? t) : t;
    return `<div class="m${focus===m.k?' on':''}" data-k="${m.k}" title="Focus on ${m.label}">
      <div class="m-top"><span class="m-name">${m.label}</span><span class="m-w">${maxPts}%</span></div>
      <div class="m-val">${raw==null?'—':m.fmt(raw)}<span class="m-w"> ${m.unit||''}</span>${delta}</div>
      <div class="m-pts">${pts.toFixed(2)} / ${maxPts.toFixed(0)} pts${cov?' <span title="DevBoost scales coverage against 100 instead of 1, so this scores ~100x low">⚠</span>':''}</div>
      <div class="track"><div class="fill" style="width:${Math.min(100,shown*100)}%;background:${hue(shown)}"></div></div>
    </div>`;
  }).join('');
  el('metrics').querySelectorAll('.m').forEach(c=>c.onclick=()=>{
    focus = (focus === c.dataset.k) ? 'score' : c.dataset.k;
    el('focus').value = focus; sortKey = focus; sortDir = -1;
    if (!writeHash()) render();
  });
}

const COLS = [
  {k:'score',           label:'Score',      good:'hi', fmt:v=>v.toFixed(1), bar:v=>v/100},
  {k:'dev_satisf_nps',  label:'Satisf NPS', good:'hi', fmt:v=>v.toFixed(0)},
  {k:'focus_nps',       label:'Focus NPS',  good:'hi', fmt:v=>v.toFixed(0)},
  {k:'prs_per_eng_day', label:'PRs/eng/d',  good:'hi', fmt:v=>v.toFixed(2)},
  {k:'pr_lifetime_hrs', label:'PR life h',  good:'lo', fmt:v=>v.toFixed(1)},
  {k:'pr_review_hrs',   label:'Review h',   good:'lo', fmt:v=>v.toFixed(1)},
  {k:'bugs_per_eng',    label:'Bugs/eng',   good:'lo', fmt:v=>v.toFixed(2)},
  {k:'depl_per_eng_day',label:'Depl/eng/d', good:'hi', fmt:v=>v.toFixed(2)},
  {k:'code_coverage',   label:'Cov %',      good:'hi', fmt:v=>v.toFixed(0)},
];

// Descendants exactly `d` levels below `g`, flattened. Depth 1 is its own children.
function atDepth(g, d){
  if (d <= 0) return [g];
  return D.nodes[g].children.flatMap(c=>atDepth(c, d-1));
}
function maxDepth(g){
  const kids = D.nodes[g].children;
  return kids.length ? 1 + Math.max(...kids.map(maxDepth)) : 0;
}
// Label for the level found at a given depth. Every depth in this hierarchy is
// level-uniform, so the first descendant's level names the whole row set.
function depthLabel(g, d){
  const ids = atDepth(g, d);
  if (!ids.length) return '';
  const lv = [...new Set(ids.map(i=>D.nodes[i].level))];
  const name = l => ({'PRODUCT-LINE':'Product lines','TRIBE':'Tribes','DOMAIN':'Domains',
                      'SQUAD':'Squads','PLATFORM':'Platform'}[l] || l);
  return lv.length === 1 ? name(lv[0]) : 'Mixed';
}
// Path from `node` down to `g`, excluding both ends — the context a flattened row loses.
function relPath(g, rootId){
  const chain = [];
  for (let p = D.nodes[g].parent; p && p !== rootId; p = D.nodes[p].parent)
    chain.unshift(D.nodes[p].name);
  return chain.join(' / ');
}

function drawChildren(node){
  const cap = el('childCap'), tbl = el('tbl'), dc = el('depthctl');
  const md = maxDepth(cur);
  if (!md) {
    cap.textContent = 'Sub-teams';
    dc.innerHTML = '';
    tbl.querySelector('thead').innerHTML = '';
    tbl.querySelector('tbody').innerHTML =
      `<tr><td class="leaf" style="padding:1rem 0.6rem">${node.name} is a squad — no sub-teams below it.</td></tr>`;
    return;
  }
  depth = Math.min(Math.max(1, depth), md);
  const kids = atDepth(cur, depth);
  cap.textContent = `Sub-teams of ${node.name} · ${kids.length}`;

  dc.innerHTML =
    `<button id="dUp" ${depth<=1?'disabled':''} title="Roll up one level">− roll up</button>` +
    `<span class="lvl-hint">${depthLabel(cur, depth)}${depth>1?` · +${depth-1}`:''}</span>` +
    `<button id="dDown" ${depth>=md?'disabled':''} title="Flatten one level deeper">+ drill down</button>`;
  dc.querySelector('#dUp').onclick   = () => { depth = Math.max(1, depth-1); if (!writeHash()) render(); };
  dc.querySelector('#dDown').onclick = () => { depth = Math.min(md, depth+1); if (!writeHash()) render(); };

  const rows = kids.map(g=>{
    const n = D.nodes[g], s = n.series[month];
    const b = baseline(n), bs = b && n.series[b];
    const dv = (s && bs && s[focus] != null && bs[focus] != null) ? s[focus]-bs[focus] : null;
    return {g, name:n.name, level:n.level, kids:n.children.length, s, delta:dv};
  });

  rows.sort((a,b)=>{
    const sortCol = COLS.find(c=>c.k===sortKey);
    const flip = (sortCol && sortCol.good==='lo') ? -1 : 1;
    const av = a.s?.[sortKey], bv = b.s?.[sortKey];
    if (av==null) return 1; if (bv==null) return -1;
    return (av-bv)*sortDir*flip;
  });

  tbl.querySelector('thead').innerHTML = '<tr>' +
    `<th data-k="name">Team</th>` +
    COLS.map(c=>`<th class="num${focus===c.k?' on':''}" data-k="${c.k}" title="${c.good==='hi'?'higher is better':'lower is better'}">${c.label}${sortKey===c.k?(sortDir<0?' ▾':' ▴'):''}</th>`).join('') +
    '</tr>';

  const FM = metricByKey(focus);
  tbl.querySelector('tbody').innerHTML = rows.map(r=>{
    if (!r.s) return `<tr class="drill" data-g="${r.g}"><td class="tname">${r.name}<span class="lvl">${r.level}</span></td>
      <td class="num leaf" colspan="${COLS.length}">no data for ${month}</td></tr>`;
    const cells = COLS.map(c=>{
      const v = r.s[c.k];
      if (v == null) return `<td class="num leaf">—</td>`;
      const t = share(c, r.s);
      const col = t == null ? 'var(--muted)' : bucket(t);
      // the focused column carries its change vs the comparison month
      let paren = '';
      if (c.k === focus && r.delta != null) {
        const better = FM.good === 'hi' ? r.delta > 0 : r.delta < 0;
        const dcol = r.delta === 0 ? 'var(--muted)' : better ? 'var(--green)' : 'var(--red)';
        paren = ` <span class="pd" style="color:${dcol}">(${r.delta>=0?'+':''}${FM.fmt(r.delta)})</span>`;
      }
      const bar = c.bar ? `<span class="bar"><i style="width:${Math.min(100,c.bar(v)*100)}%;background:${col}"></i></span>` : '';
      return `<td class="num${focus===c.k?' on':''}"><span class="cell">${bar}<span style="color:${col};font-weight:600">${c.fmt(v)}</span>${paren}</span></td>`;
    }).join('');
    const ctx = depth > 1 ? `<span class="ppath">${relPath(r.g, cur)}</span>` : '';
    return `<tr class="${r.kids?'drill':''}" data-g="${r.g}">
      <td class="tname">${r.name}<span class="lvl">${r.level}${r.kids?` · ${r.kids}`:''}</span>${ctx}</td>${cells}</tr>`;
  }).join('');

  tbl.querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const k = th.dataset.k; if (k==='name') return;
    if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=-1; }
    if (!writeHash()) render();
  });
  tbl.querySelectorAll('tr.drill').forEach(tr=>tr.onclick=()=>go(tr.dataset.g));
}

function drawNotes(node, s){
  const out = [];
  if (s && s.imputed)
    out.push('One or more metrics had no source data this month and were imputed at the 0.5 midpoint, which inflates the score toward the middle.');
  if (s && s.code_coverage != null)
    out.push(`Code coverage is scored against a maximum of 100 though the raw value is a fraction, so DevBoost credits this team ${(s.n_code_coverage*5).toFixed(2)} of 5 points instead of ${((s.n_code_coverage_fixed??0)*5).toFixed(2)}. Every team loses roughly the same ~4.7 points, so rankings hold but absolute scores read low.`);
  el('notes').innerHTML = out.map(t=>`<div class="note">${t}</div>`).join('');
}
</script>
</body>
